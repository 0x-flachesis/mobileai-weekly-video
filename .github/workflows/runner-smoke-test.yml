name: runner-smoke-test

# 連通性矩陣測試：分別用不同 runs-on 對照
on:
  workflow_dispatch:

jobs:
  probe-home:
    runs-on: home
    timeout-minutes: 5
    steps:
      - run: echo "runner: $(hostname) @ $(uname -m)"
  probe-selfhosted:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - run: echo "runner: $(hostname) @ $(uname -m)"
